name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate and package static site
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      MPLBACKEND: Agg
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      STREAMLIT_SERVER_HEADLESS: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          npm ci
          npx playwright install --with-deps chromium

      - name: Run quality gates
        run: |
          python -X utf8 scripts/quality_check.py
          npm run test:e2e

      - name: Build static artifact
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html _site/
          cp README.md _site/
          cp -R assets _site/assets
          cp -R deep_learning_book _site/deep_learning_book
          cp -R docs _site/docs
          cp -R part1_foundations _site/part1_foundations
          cp -R part2_cnn _site/part2_cnn
          cp -R part3_rnn _site/part3_rnn
          cp -R part4_transformer _site/part4_transformer
          cp -R part5_toolbox _site/part5_toolbox
          cp -R part6_universal_framework _site/part6_universal_framework
          cp -R part7_interview _site/part7_interview

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Publish to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
